name: Java CI with JaCoCo
on:
  push:
    paths:
      - 'impl/java/**'  # Alleen uitvoeren als er wijzigingen zijn in impl/java/
  pull_request:
    paths:
      - 'impl/java/**'  # Alleen uitvoeren als er wijzigingen zijn in impl/java/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build with Maven (in impl/java)
        working-directory: impl/java
        run: mvn -B test

      - name: Upload JaCoCo Report to Codecov
        working-directory: impl/java
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: target/site/jacoco/jacoco.xml